openapi: 3.0.0
info:
  title: AML Checker - Compliance System API
  description: API Gateway for Sanctions Screening System with JWT and API Key authentication
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: Local Docker Environment

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for users (Frontend)
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for B2B integration
    apiSecretAuth:
      type: apiKey
      in: header
      name: x-api-secret
      description: API secret for B2B integration
  schemas:
    OrganizationServices:
      type: object
      description: Service package of an organization. At least one service must be enabled.
      required: [sanctions, identityMode]
      properties:
        sanctions:
          type: boolean
          description: Manual sanctions screening (Dashboard, Check, History, /sanctions/*)
          example: true
        identityMode:
          type: string
          enum: [NONE, IDENTITY, FULL_AML]
          description: Identity verification mode (FULL_AML adds automatic sanctions screening)
          example: NONE
    OrganizationSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
        city:
          type: string
        address:
          type: string
        createdAt:
          type: string
          format: date-time
        services:
          $ref: '#/components/schemas/OrganizationServices'
        userCount:
          type: integer
    ServiceNotEnabled:
      type: object
      properties:
        error:
          type: string
          example: Service not enabled for organization
        service:
          type: string
          example: sanctions

security:
  - bearerAuth: []
  - apiKeyAuth: []
    apiSecretAuth: []

paths:
  # ==================== GATEWAY ====================

  /health:
    get:
      summary: Gateway health check
      description: Returns the API Gateway service status. No authentication required.
      tags: [Gateway]
      security: []
      responses:
        200:
          description: Gateway is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: api-gateway
                  status:
                    type: string
                    example: UP

  # ==================== AUTH SERVICE ====================

  /auth/login:
    post:
      summary: User login
      description: >
        Authenticate user and receive a short-lived JWT access token in the response body.
        A refresh token is set as an **HttpOnly cookie** (`refreshToken`) — it is NOT
        returned in the JSON body.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@testcorp.com
                password:
                  type: string
                  format: password
                  example: Password123!
      responses:
        200:
          description: Login successful
          headers:
            Set-Cookie:
              description: >
                HttpOnly refresh token cookie: `refreshToken=<token>; HttpOnly; Path=/auth;
                SameSite=Lax`. Use `withCredentials: true` (axios) or `credentials: include`
                (fetch) so the browser sends this cookie on subsequent requests.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  accessToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      organizationId:
                        type: string
        401:
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh access token
      description: >
        Exchange the HttpOnly `refreshToken` cookie for a new access token.
        No request body required — the cookie is sent automatically by the browser.
        On success the old cookie is revoked and a new rotated `refreshToken` cookie is set.
      tags: [Authentication]
      security: []
      responses:
        200:
          description: Token refreshed
          headers:
            Set-Cookie:
              description: Rotated refreshToken HttpOnly cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        401:
          description: Missing refresh token cookie
        403:
          description: Invalid or revoked refresh token

  /auth/logout:
    post:
      summary: Logout user
      description: >
        Revoke the refresh token and clear the HttpOnly cookie.
        No request body required — the `refreshToken` cookie is read automatically.
        Returns 200 even if no cookie is present (graceful logout).
      tags: [Authentication]
      security: []
      responses:
        200:
          description: Logout successful

  /auth/register-organization:
    post:
      summary: Register new organization (SuperAdmin only)
      description: Create new organization with admin user. Requires SuperAdmin JWT.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgName, country, city, email, password, firstName, lastName]
              properties:
                orgName:
                  type: string
                  example: Acme Corp
                country:
                  type: string
                  example: PL
                city:
                  type: string
                  example: Warsaw
                address:
                  type: string
                  example: Main St 1
                email:
                  type: string
                  format: email
                  example: admin@acme.com
                password:
                  type: string
                  format: password
                  example: SecretPass1!
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                services:
                  $ref: '#/components/schemas/OrganizationServices'
      responses:
        201:
          description: Organization registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  organization:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      location:
                        type: string
                      apiKey:
                        type: string
                      apiSecret:
                        type: string
                      services:
                        $ref: '#/components/schemas/OrganizationServices'
                  user:
                    type: object
        400:
          description: Validation error (e.g. "At least one service must be enabled")
        403:
          description: Forbidden - SuperAdmin only

  /auth/register-user:
    post:
      summary: Register new user in organization (Admin only)
      description: >
        Create a new regular user within the authenticated admin's organization.
        Role is always forced to `user` regardless of input.
        Sends a welcome email to the new user.
      tags: [Authentication]
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                      organizationId:
                        type: string
        400:
          description: Validation error or duplicate email
        403:
          description: Forbidden — admin or superadmin role required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                firstName:
                  type: string
                lastName:
                  type: string

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Send password reset link to user email
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Reset link sent

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Confirm password reset using token from email
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, token, newPassword]
              properties:
                userId:
                  type: string
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password reset successful
        400:
          description: Invalid or expired token

  /auth/change-password:
    post:
      summary: Change password
      description: Change password for authenticated user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        200:
          description: Password changed successfully
        400:
          description: Invalid current password

  /auth/organization/keys:
    get:
      summary: Get organization API key
      description: Retrieve organization's public API key (Admin only)
      tags: [Authentication]
      responses:
        200:
          description: API key retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string

  /auth/reset-secret:
    post:
      summary: Reset organization API secret
      description: Generate new API secret (Admin only, requires password confirmation)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        200:
          description: Secret reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  apiKey:
                    type: string
                  newApiSecret:
                    type: string
        403:
          description: Incorrect password or forbidden

  # ==================== USER MANAGEMENT ====================
  
  /auth/organizations:
    get:
      summary: List organizations (SuperAdmin only)
      description: Paginated list of organizations with service packages and user counts, newest first.
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive organization name filter
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        200:
          description: Organizations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationSummary'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        401:
          description: Unauthorized
        403:
          description: Forbidden - SuperAdmin only

  /auth/organizations/{id}:
    get:
      summary: Get organization details (SuperAdmin only)
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        401:
          description: Unauthorized
        403:
          description: Forbidden - SuperAdmin only
        404:
          description: Organization not found

  /auth/organizations/{id}/services:
    put:
      summary: Replace organization service package (SuperAdmin only)
      description: >
        Changes reach signed-in users on their next token refresh (up to 15 minutes)
        and API key clients after the gateway cache expires (up to 60 seconds).
      tags: [SuperAdmin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationServices'
      responses:
        200:
          description: Services updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummary'
        400:
          description: Validation error (missing field, unknown identityMode, no service enabled)
        401:
          description: Unauthorized
        403:
          description: Forbidden - SuperAdmin only
        404:
          description: Organization not found

  /users:
    get:
      summary: Get all users
      description: >
        List all regular users in the authenticated admin's organization.
        Admins and superadmins are excluded from the returned list.
      tags: [User Management]
      responses:
        200:
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        role:
                          type: string
                        createdAt:
                          type: string
                          format: date-time

    post:
      summary: Create new user
      description: >
        Create a new user in the authenticated admin's organization.
        Role is always forced to `user`. The `organizationId` is derived from the
        authenticated admin's context — it must NOT be sent in the request body.
      tags: [User Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        201:
          description: User created successfully
        400:
          description: Validation error or duplicate email
        403:
          description: Forbidden — admin or superadmin role required

  /users/{userId}:
    delete:
      summary: Delete user
      description: Remove user from organization (Admin only)
      tags: [User Management]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted successfully
        403:
          description: Forbidden - Admin only
        404:
          description: User not found

  # ==================== SANCTIONS SCREENING ====================
  
  /sanctions/check:
    get:
      summary: Check entity against sanctions lists
      description: Screen name against international sanctions databases. Supports JWT and API Key authentication.
      tags: [Sanctions]
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name or company name to check
          example: Vladimir Putin
      responses:
        200:
          description: Screening completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      query:
                        type: string
                      timestamp:
                        type: string
                  hits_count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        schema:
                          type: string
                        properties:
                          type: object
                        datasets:
                          type: array
                        score:
                          type: number
        400:
          description: Missing or invalid parameters
        401:
          description: Unauthorized
        403:
          description: Sanctions screening is not enabled for the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceNotEnabled'

  /sanctions/history:
    get:
      summary: Get search history
      description: Retrieve audit logs for organization with pagination and filters
      tags: [Sanctions]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Filter by search query
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: hasHit
          schema:
            type: boolean
          description: Filter by whether results were found
      responses:
        200:
          description: History retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        searchQuery:
                          type: string
                        hasHit:
                          type: boolean
                        hitsCount:
                          type: integer
                        userId:
                          type: string
                        userName:
                          type: string
                        userEmail:
                          type: string
                        organizationId:
                          type: string
                        isSanctioned:
                          type: boolean
                        isPep:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalItems:
                        type: integer
                      itemsPerPage:
                        type: integer

  /sanctions/health:
    get:
      summary: Core Service health check
      description: Proxied health check for the Core Service. Returns Core Service and PostgreSQL status.
      tags: [Sanctions]
      responses:
        200:
          description: Core Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: core-service
                  status:
                    type: string
                    example: UP
                  database:
                    type: string
                    example: Connected
        401:
          description: Unauthorized
        502:
          description: Core Service unavailable

  /sanctions/stats:
    get:
      summary: Get dashboard statistics
      description: Retrieve aggregated screening statistics for the authenticated organization.
      tags: [Sanctions]
      responses:
        200:
          description: Statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalChecks:
                    type: integer
                  sanctionHits:
                    type: integer
                  pepHits:
                    type: integer
                  recentLogs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        searchQuery:
                          type: string
                        isSanctioned:
                          type: boolean
                        isPep:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time