# Define the services
# Op-adapter connects to Yente (OpenSanctions) API
# Yente uses Elasticsearch as its data store
services:
  api-gateway:
    build: ./api-gateway
    volumes:
      - ./api-gateway/logs:/app/logs
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      - PORT=8080
      # URLs for downstream services
      - AUTH_SERVICE_URL=http://auth-service:3000
      - OP_ADAPTER_URL=http://op-adapter:3000
      - JWT_SECRET=${JWT_SECRET}
      - CORE_SERVICE_URL=http://core-service:3000
      - IDV_SERVICE_URL=http://idv-service:3000
    depends_on:
      - auth-service
      - op-adapter

  frontend:
    build: ./frontend
    container_name: ${FRONTEND_CONTAINER_NAME}
    ports:
      - "80:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - default
    # Compose Watch (run with: docker compose up --build --watch)
    # Replaces the old bind mount + anonymous node_modules volume,
    # which kept stale dependencies after package.json changes.
    develop:
      watch:
        # Source code — copied into the running container, Vite HMR picks it up
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        # Vite config — copy and restart the dev server
        - action: sync+restart
          path: ./frontend/vite.config.js
          target: /app/vite.config.js
        # Dependencies — rebuild the image (fresh npm ci) and recreate the container
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
  op-adapter:
    build: ./op-adapter
    # For testing purposes, delete comments below to expose port
    #ports:
    #  - "3001:3000"   
    volumes:
      - ./op-adapter/logs:/app/logs        
    environment:
      - YENTE_API_URL=http://yente:${YENTE_PORT}
    depends_on:
      yente:
        condition: service_started

  auth-service:
    build: ./auth-service
    # For testing purposes, delete comments below to expose port
    #ports:
    #  - "${PORT_AUTH}:3000"
    volumes:
      - ./auth-service/logs:/app/logs
    environment:
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:${MONGO_PORT}/${MONGO_DB_NAME}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      # Ethernal config for email sending
      - EMAIL_SERVICE=${EMAIL_SERVICE}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      # Frontend URL for password reset links
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - mongo

  core-service:
    build: ./core-service
    # For testing purposes, delete comments below to expose port
    #ports:
    #  - "3005:3000" # External access on port 3005 (for debugging)
    volumes:
      - ./core-service/logs:/app/logs
    environment:
      - DB_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - OP_ADAPTER_URL=http://op-adapter:3000
    depends_on:
      - postgres
      - op-adapter

  # Identity verification (own database idv_db, created on first start)
  idv-service:
    build: ./idv-service
    volumes:
      - ./idv-service/logs:/app/logs
      # Encrypted copies of document and selfie images
      - idv_data:/app/data
    environment:
      - DB_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - IDV_DB_NAME=idv_db
      - IDV_PROVIDER=${IDV_PROVIDER:-idswyft}
      - IDSWYFT_API_URL=http://idswyft-api:3001
      - IDSWYFT_API_KEY=${IDSWYFT_API_KEY:-}
      - IDSWYFT_TIMEOUT_MS=${IDSWYFT_TIMEOUT_MS:-90000}
      - CORE_SERVICE_URL=http://core-service:3000
      # Base of the customer verification link: <FRONTEND_URL>/verify/<token>
      - FRONTEND_URL=${FRONTEND_URL}
      - IDV_STORAGE_DIR=/app/data
      - IDV_STORAGE_KEY=${IDV_STORAGE_KEY}
      - IDV_LINK_TTL_HOURS=${IDV_LINK_TTL_HOURS:-72}
      - IDV_SESSION_TTL_MINUTES=${IDV_SESSION_TTL_MINUTES:-60}
      - IDV_IMAGE_RETENTION_DAYS=${IDV_IMAGE_RETENTION_DAYS:-14}
      - IDV_MAX_DOCUMENT_ATTEMPTS=${IDV_MAX_DOCUMENT_ATTEMPTS:-3}
      - IDV_MAX_SELFIE_ATTEMPTS=${IDV_MAX_SELFIE_ATTEMPTS:-3}
      - IDV_JOBS_INTERVAL_MS=${IDV_JOBS_INTERVAL_MS:-300000}
    depends_on:
      postgres:
        condition: service_started
      core-service:
        condition: service_started
      # Not started when the "idswyft" profile is off (IDV_PROVIDER=fake)
      idswyft-api:
        condition: service_started
        required: false

  # OpenSanctions (Yente)
  yente:
    image: ghcr.io/opensanctions/yente:5.1.0
    ports:
      - "${YENTE_PORT}:8000"
    environment:
      - YENTE_TITLE=${YENTE_TITLE}
      # "default" the full OpenSanctions dataset
      # "us_ofac_sdn" the US main sanctions list
      - YENTE_MANIFEST=${YENTE_MANIFEST}
      # Use local Elasticsearch instance (local)
      - YENTE_ELASTICSEARCH_URL=http://elasticsearch:9200
      # Automatic data update on startup
      - YENTE_UPDATE_DATA=${YENTE_UPDATE_DATA}     
    volumes:
      # Saving downloaded data to disk
      - yente_data:/data
      # Mounting the manifest file
      - ./manifest.yml:/manifest.yml
    depends_on:
      elasticsearch:
        condition: service_healthy # Ensure ES is healthy before starting Yente
    deploy:
      resources:
        limits:
          memory: 4G

  # Data Base for Yente (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=${ES_DISCOVERY_TYPE}
      - xpack.security.enabled=${ES_SECURITY_ENABLED} # Disable security for simplicity
      - ES_JAVA_OPTS=${ES_JAVA_OPTS} # Limit Java to 1GB RAM
    ports:
      - "9200:9200" # Elasticsearch REST API for debugging
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2G

    # Check Elasticsearch health
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 12


  # Databases
  # Database for Auth Service (Users/Organizations)
  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_PORT}:27017"
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

  # Database for Core Service (Logs/History)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Identity verification engine (self-hosted idswyft-community, MIT)
  # Prebuilt images pinned by digest — see infra/idswyft/README.md for versions and updates.
  # Enabled by the "idswyft" profile (COMPOSE_PROFILES=idswyft in .env).
  idswyft-postgres:
    image: postgres:16-alpine
    profiles: ["idswyft"]
    environment:
      - POSTGRES_DB=idswyft
      - POSTGRES_USER=idswyft
      - POSTGRES_PASSWORD=${IDSWYFT_DB_PASSWORD}
    volumes:
      - idswyft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idswyft -d idswyft"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  idswyft-engine:
    image: ghcr.io/team-idswyft/idswyft-engine@sha256:5da684c9c21afd6eec50ab40e128ab524f1c831277bc3b81e97cf089412f702e
    profiles: ["idswyft"]
    environment:
      - NODE_ENV=production
      - PORT=3002
      - LOG_LEVEL=info
    volumes:
      # PaddleOCR downloads its ONNX models here on the first OCR request
      - idswyft_engine_cache:/home/nodeuser/.cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  idswyft-api:
    image: ghcr.io/team-idswyft/idswyft-api@sha256:2b08ca2f40cfc9085c7ed3a95e6eaba4475f9d7afd51a4580552629871fcc93f
    profiles: ["idswyft"]
    depends_on:
      idswyft-postgres:
        condition: service_healthy
      idswyft-engine:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://idswyft:${IDSWYFT_DB_PASSWORD}@idswyft-postgres:5432/idswyft
      # SSL is auto-enabled for hosts other than "localhost"/"postgres" — internal network, no TLS
      - DATABASE_SSL=false
      - JWT_SECRET=${IDSWYFT_JWT_SECRET}
      - API_KEY_SECRET=${IDSWYFT_API_KEY_SECRET}
      - ENCRYPTION_KEY=${IDSWYFT_ENCRYPTION_KEY}
      - SERVICE_TOKEN=${IDSWYFT_SERVICE_TOKEN}
      - ENGINE_URL=http://idswyft-engine:3002
      - STORAGE_PROVIDER=local
      - STORAGE_ENCRYPTION=true
      - SANDBOX_MODE=false
      # Default cap is 5 verifications / 24 h per developer account — all our organizations share one
      - RATE_LIMIT_ENABLED=false
      # Their AML module falls back to "clear" on errors — screening is done by core-service instead
      - AML_PROVIDER=none
      - DATA_RETENTION_DAYS=14
      - MIGRATIONS_LENIENT=true
      - CORS_ORIGINS=
    volumes:
      - idswyft_uploads:/app/backend/uploads
      - idswyft_temp:/app/backend/temp
      - ./infra/idswyft/migrations:/app/backend/migrations:ro
    ports:
      # Localhost only — used by the bootstrap/probe scripts
      - "127.0.0.1:${IDSWYFT_API_PORT:-3010}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  yente_data:
  es_data:
  mongo_data:
  postgres_data:
  idv_data:
  idswyft_pgdata:
  idswyft_uploads:
  idswyft_temp:
  idswyft_engine_cache: